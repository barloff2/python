<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    <h1>Ingresar</h1>
    <form method="post">
        {% csrf_token %}
        {{form.as_p}}
        <input type="submit" value="Ingresar">
    </form>

    <p>No tienes una cuenta? <a href="{% url 'registro' %}">Registrate</a></p>
</body>
</html>
